services:
  finetune:
    build: .
    image: handschrift-ocr-finetune:latest
    # Portable GPU-Reservierung (Compose Spec, funktioniert mit "docker compose
    # up/run", nicht nur im Swarm-Modus). Alternative auf neueren Docker-
    # Compose-Versionen: einfach "gpus: all" statt des ganzen deploy-Blocks.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${DATASET_ROOT}:/data:ro
      - ${OUTPUT_DIR:-./output}:/output
      - huggingface-cache:/root/.cache/huggingface
    environment:
      FT_MODEL: ${FT_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
      FT_DATASET: ${FT_DATASET:-/data/train_swift.jsonl}
      FT_OUTPUT_DIR: ${FT_OUTPUT_DIR_CONTAINER:-/output/qwen3-vl-4b-handschrift}
      FT_EPOCHS: ${FT_EPOCHS:-3}
    stdin_open: true
    tty: true
    command: ["./train.sh"]

volumes:
  huggingface-cache:
